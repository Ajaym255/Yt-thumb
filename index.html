<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download YouTube Thumbnails in HD, SD & 4K for free. Simple & Fast!">
    <meta name="keywords" content="YouTube Thumbnail Downloader, HD Thumbnails, Download YouTube Thumbnails, Free YouTube Thumbnails">
    <title>YouTube Thumbnail Downloader</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>📥 YouTube Thumbnail Downloader</h1>
        <p>Enter YouTube video URL and get thumbnails in multiple sizes instantly!</p>

        <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL Here" required>
        <button onclick="getThumbnail()">🔍 Fetch Thumbnails</button>

        <div id="thumbnail-container" class="hidden">
            <h3>📸 Available Thumbnails</h3>
            <div class="thumbnail">
                <img id="maxres" alt="Max Resolution Thumbnail">
                <a id="maxresDownload" download>📥 Download Max Resolution</a>
            </div>
            <div class="thumbnail">
                <img id="hq" alt="High Quality Thumbnail">
                <a id="hqDownload" download>📥 Download HQ</a>
            </div>
            <div class="thumbnail">
                <img id="sd" alt="Standard Quality Thumbnail">
                <a id="sdDownload" download>📥 Download SD</a>
            </div>
            <div class="thumbnail">
                <img id="default" alt="Default Thumbnail">
                <a id="defaultDownload" download>📥 Download Default</a>
            </div>
        </div>

        <button id="darkModeToggle">🌙 Toggle Dark Mode</button>
    </div>
</body>
</html>
